services:
  go2rtc:
    image: ghcr.io/alexxit/go2rtc:1.9.14
    container_name: daihougou-go2rtc
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./deploy/go2rtc/state:/config

  app:
    build:
      context: .
      dockerfile: docker/mvp.Dockerfile
    image: daihougou-mvp:local
    container_name: daihougou-app
    network_mode: host
    restart: unless-stopped
    depends_on:
      go2rtc:
        condition: service_started
    env_file:
      - path: .env.mvp
        required: false
    environment:
      HOME: /var/lib/daihougou/mi
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./deploy/app/state:/var/lib/daihougou/data
      - ./deploy/miservice/state:/var/lib/daihougou/mi
    healthcheck:
      test: ["CMD", "python", "-m", "daihougou.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  probe:
    build:
      context: .
      dockerfile: docker/poc.Dockerfile
    image: daihougou-poc:local
    network_mode: host
    env_file: .env.poc
    environment:
      HOME: /var/lib/daihougou/mi
    volumes:
      - ./artifacts:/workspace/artifacts
      - ./config:/workspace/config:ro
      - ./deploy/miservice/state:/var/lib/daihougou/mi
    profiles: ["tools"]

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8.3
    container_name: daihougou-homeassistant
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - ./deploy/homeassistant/state:/config
    profiles: ["ha"]
